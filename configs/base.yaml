seed: 7

environment:
  map_size: 10000.0
  dt: 1.0
  episode_steps: 300
  speed_min: 50.0
  speed_max: 150.0
  initial_speed_min: 95.0
  initial_speed_max: 105.0
  max_acceleration: 10.0
  max_turn_rate_degrees: 10.0
  spawn_x_min: 3200.0
  spawn_x_max: 3800.0
  spawn_y_min: -3000.0
  spawn_y_max: 3000.0
  min_spawn_y_separation: 500.0
  heading_jitter_degrees: 5.0
  radar_range: 3000.0
  attack_range: 1000.0
  attack_ata_degrees: 30.0
  attack_aspect_degrees: 45.0
  collision_distance: 50.0
  blue_escape_distance: null

reward:
  weapon_kill_reward: 10.0
  weapon_loss_penalty: 10.0
  oob_penalty: 20.0
  collision_penalty: 5.0
  terminal_reward: 20.0

render:
  width: 800
  height: 800
  margin: 45
  show_trails: true
  trail_length: 80
  icon_source: "对抗环境图.png"

mappo:
  hidden_size: 128
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_clip: 0.2
  entropy_coefficient: 0.01
  value_coefficient: 0.5
  max_grad_norm: 0.5
  update_epochs: 10
  minibatch_size: 512

training:
  total_env_steps: 2000000
  parallel_envs: 16
  rollout_length: 128
  log_interval_steps: 20000
  checkpoint_interval_steps: 100000
  evaluation_interval_steps: 100000
  evaluation_episodes: 100
  output_dir: runs/v2_1_5v5_seed7
  device: cuda
