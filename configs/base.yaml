seed: 7

environment:
  map_size: 10000.0
  dt: 1.0
  episode_steps: 150
  speed_min: 150.0
  speed_max: 250.0
  initial_speed_min: 190.0
  initial_speed_max: 210.0
  max_acceleration: 20.0
  max_turn_rate: 0.2617993878
  spawn_x: 3500.0
  spawn_y_spacing: 1500.0
  spawn_jitter: 200.0
  heading_jitter_degrees: 5.0
  attack_range: 1200.0
  attack_ata_degrees: 30.0
  attack_aspect_degrees: 45.0
  potential_distance_scale: 3000.0
  blue_assignment_interval: 5
  blue_tail_distance: 800.0
  blue_boundary_margin: 500.0

reward:
  terminal_reward: 3.0
  shaping_scale: 0.1
  shaping_gamma: 0.99

render:
  width: 800
  height: 800
  margin: 45
  show_trails: true
  trail_length: 80
  icon_source: "对抗环境图.png"

mappo:
  hidden_size: 128
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_clip: 0.2
  entropy_coefficient: 0.01
  value_coefficient: 0.5
  max_grad_norm: 0.5
  update_epochs: 10
  minibatch_size: 512

training:
  total_env_steps: 2000000
  parallel_envs: 16
  rollout_length: 128
  log_interval_steps: 20000
  checkpoint_interval_steps: 100000
  evaluation_interval_steps: 100000
  evaluation_episodes: 100
  output_dir: "runs/fixed_3v3"
  device: "cuda"
