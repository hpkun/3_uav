seed: 7

environment:
  map_size: 10000.0
  dt: 1.0
  episode_steps: 300
  speed_min: 50.0
  speed_max: 150.0
  initial_speed: 100.0
  spawn_x: 3500.0
  spawn_y_spacing: 1500.0
  spawn_jitter: 200.0
  attack_range: 600.0
  radar_range: 2000.0
  attack_ata_degrees: 15.0
  attack_aspect_degrees: 50.0
  collision_distance: 150.0
  collision_avoidance_distance: 450.0
  collision_reward_distance: 600.0

reward:
  all_enemy_destroyed_reward: 100.0
  timeout_advantage_reward: 80.0
  enemy_kill_reward: 20.0
  all_own_destroyed_penalty: 100.0
  timeout_disadvantage_penalty: 80.0
  own_loss_penalty: 20.0

render:
  width: 800
  height: 800
  margin: 45
  show_trails: true
  trail_length: 80
  icon_source: "对抗环境图.png"

mappo:
  hidden_size: 128
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_clip: 0.2
  entropy_coefficient: 0.01
  value_coefficient: 0.5
  max_grad_norm: 0.5
  update_epochs: 10
  minibatch_size: 512

training:
  blue_strategy: 1
  total_env_steps: 2000000
  parallel_envs: 16
  rollout_length: 128
  log_interval_steps: 20000
  checkpoint_interval_steps: 100000
  evaluation_interval_steps: 100000
  evaluation_episodes: 100
  output_dir: "runs/xu_course1_seed7"
  device: "cuda"
