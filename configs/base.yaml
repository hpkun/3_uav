seed: 7

environment:
  agents_per_team: 3
  map_size: 10000.0
  center_size: 3000.0
  physics_dt: 0.2
  decision_dt: 1.0
  episode_seconds: 150.0
  speed_min: 150.0
  speed_max: 250.0
  initial_speed: 200.0
  max_acceleration: 20.0
  max_turn_rate: 0.2617993878
  agent_radius: 25.0
  spawn_x_fraction: 0.42
  spawn_y_fraction: 0.28
  spawn_jitter: 120.0
  heading_jitter_degrees: 8.0
  boundary_grace_seconds: 2.0
  collision_enabled: false
  radar_range: 3000.0
  radar_fov_degrees: 120.0
  weapon_range: 1200.0
  weapon_fov_degrees: 60.0
  tail_cone_degrees: 120.0
  lock_seconds: 1.5
  lock_decay_rate: 2.0
  ammunition: 2

reward:
  kill: 20.0
  loss: -20.0
  win: 100.0
  lose: -100.0
  boundary: -5.0
  collision: -2.0
  step: -0.001
  shaping_scale: 0.2
  shaping_gamma: 0.99
  team_fraction: 0.8
  local_fraction: 0.2

render:
  width: 800
  height: 800
  margin: 45
  show_center: false
  show_radar: false
  show_weapon: false
  show_trails: true
  trail_length: 80
  icon_source: "对抗环境图.png"

mappo:
  hidden_size: 128
  learning_rate: 0.0005
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.1
  value_clip: 0.2
  entropy_coefficient: 0.01
  value_coefficient: 0.5
  max_grad_norm: 0.5
  update_epochs: 5

training:
  episodes: 2000
  parallel_envs: 16
  rule_opponent_episodes: 300
  snapshot_interval: 100
  snapshot_pool_size: 8
  checkpoint_interval: 100
  log_interval: 10
  output_dir: "runs/default"
  device: "cuda"
